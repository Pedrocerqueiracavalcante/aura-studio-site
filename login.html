<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFFFFF">
  <title>Entrar · Menuz</title>
  <meta name="description" content="Acesse o painel Menuz para editar a página da sua barbearia.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=20260727-02">
</head>
<body class="minimal-page">
  <main class="login-page" id="main">
    <a class="login-brand" href="index.html" aria-label="Voltar para a página inicial">
      <img src="assets/img/logo.svg" alt="" width="46" height="46">
      <span>Menuz</span>
    </a>

    <section class="login-box" aria-labelledby="loginTitle">
      <p class="minimal-kicker" data-i18n="login.eyebrow">Login do barbeiro</p>
      <h1 id="loginTitle" data-i18n="login.title">Entre no painel</h1>
      <form class="clean-login-form" data-clean-login onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <label for="email" data-i18n="login.email">E-mail</label>
        <input id="email" type="email" placeholder="barbeiro@menuz.com.br" autocomplete="email" required>

        <label for="password" data-i18n="login.password">Senha</label>
        <input id="password" type="password" placeholder="Sua senha" autocomplete="current-password" required data-i18n-placeholder="login.passwordPlaceholder">

        <button class="btn btn--primary btn--block btn--lg" type="submit" data-i18n="user.signIn">Entrar</button>
        <a class="btn btn--ghost btn--block btn--lg" href="dashboard.html?new=1" data-i18n="user.signUp">Criar conta</a>
      </form>
      <a class="login-help" href="mailto:contato@menuz.com.br" data-i18n="login.recover">Recuperar senha</a>
    </section>
  </main>
  <script src="assets/js/main.js?v=20260727-02" defer></script>
</body>
</html>
